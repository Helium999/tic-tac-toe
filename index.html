<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Tic-Tac-Toe</h3>
    <form>
        <label for="p1name">Enter Player 1's name:</label>
        <input type="text" id="p1name" name="p1name" placeholder="Player 1">

        <fieldset>
            <label for="p1markerx">X</label>
            <input type="radio" id="p1markerx" name="p1marker" value="X">
            <label for="p1markero">O</label>
            <input type="radio" id="p1markero" name="p1marker" value="O">
        </fieldset>
        
        <label for="p2name">Enter Player 2's name:</label>
        <input type="text" id="p2name" name="p2name" placeholder="Player 2">

        <fieldset>
            <label for="p2markerx">X</label>
            <input type="radio" id="p2markerx" name="p2marker" value="X">
            <label for="p2markero">O</label>
            <input type="radio" id="p2markero" name="p2marker" value="O">
        </fieldset>

        <button type="button" id="playButton">PLAY</button>
    </form>
</body>
</html>
